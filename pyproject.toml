[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remedy-pdf-desktop"
version = "1.0.0"
description = "Standalone PDF accessibility remediation desktop app"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Remedy PDF Desktop Contributors" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "websockets>=13.0",

    # Math formula remediation
    "latex2mathml>=3.70.0",
    "lxml>=5.0.0",

    # PDF remediation engine (bundled in lib/)
    "pikepdf>=9.0.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.25.0",
    "fonttools>=4.50.0",

    # Supporting libraries
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.20.0",

    # Office format support (needed by project_remedy imports)
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "lib/project_remedy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
# Per-test timeout so a single hang cannot wedge the whole CI run.
# Individual slow tests can override with @pytest.mark.timeout(N).
timeout = 300
timeout_method = "thread"
markers = [
    "slow: marks tests as slow end-to-end pipeline runs (deselected by default; run with --runslow)",
]
